# ============================================= #
#                  GENERAL                       #
# ============================================= #

set -g default-terminal "tmux-256color"
set -sg terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g escape-time 0
set -g focus-events on
set -g display-time 2000
set -g display-panes-time 2000
set -g status-interval 5
set -g update-environment "SSH_AUTH_SOCK SSH_AGENT_PID DISPLAY"
set -g status-position top

# ============================================= #
#                  PREFIX                        #
# ============================================= #

set -g prefix C-Space
bind C-Space send-prefix
bind C-Space last-window

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# ============================================= #
#                  WINDOW                        #
# ============================================= #

bind c new-window -c "#{pane_current_path}"
bind , command-prompt "rename-window '##'"
bind & confirm-before -p "kill window? (y/n)" kill-window

# ============================================= #
#                  PANE                         #
# ============================================= #

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind x kill-pane
bind z resize-pane -Z

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================= #
#                  NAVIGATION                    #
# ============================================= #

bind -n S-Left previous-window
bind -n S-Right next-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# ============================================= #
#                  POPUPS & SCRIPTS              #
# ============================================= #

bind t run-shell "tmux-popup-term"
bind g run-shell "tmux-lazygit"
bind B run-shell "tmux-btop"
bind e run-shell "tmux-edit"
# Install: go install github.com/bensadeh/circumflex/cmd/clx@latest
# Link: ln -sf ~/go/bin/clx ~/.local/bin/clx
# Browser: create ~/.local/bin/open + symlink as xdg-open/wslview
bind N display-popup -w 90% -h 90% -E clx

# ============================================= #
#                  THEME                         #
# ============================================= #

# ============================================= #
#                  PLUGINS                       #
# ============================================= #

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @plugin 'MeinardEdrei/tmux-spotlight'

# Plugin options
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @tokyo-night-tmux_theme night
set -g @spotlight-bind-triggerless 'off'

# Auto-install TPM if missing
if-shell "test ! -d ~/.config/tmux/plugins/tpm" {
    run-shell "tmux-plugins-install"
}

# Initialize TPM (keep at bottom)
run "~/.config/tmux/plugins/tpm/tpm"

# Status bar overrides (after theme applies)
set -g status-justify centre
set -g status-left ""
set -g status-right "#[fg=#7aa2f7,bold]#S "
